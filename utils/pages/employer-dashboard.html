<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employer Dashboard — Smart Job Portal</title>
   <link rel="stylesheet" href="../../Frontend/css/main.css">
</head>
<body class="page-wrapper">
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">Job<span>Portal</span></a>
      <div class="nav-links" id="nav-links"></div>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-header flex-between">
        <div>
          <h1 id="greeting">Employer Dashboard</h1>
          <p class="text-sec">Manage your job postings and applicants</p>
        </div>
        <a href="post-job.html" class="btn btn-primary">+ Post a New Job</a>
      </div>

      <!-- Stats -->
      <div class="stats-grid" style="margin-bottom:24px">
        <div class="card stat-card">
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">Total Postings</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-open" style="color:var(--green)">—</div>
          <div class="stat-label">Active Jobs</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-applicants">—</div>
          <div class="stat-label">Total Applicants</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-closed" style="color:var(--text-muted)">—</div>
          <div class="stat-label">Closed Jobs</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('jobs', this)">My Job Postings</div>
        <div class="tab" onclick="switchTab('applicants', this)">Applicants</div>
      </div>

      <!-- Jobs Tab -->
      <div id="tab-jobs">
        <div id="jobs-list"><div class="loader"></div></div>
      </div>

      <!-- Applicants Tab -->
      <div id="tab-applicants" class="hidden">
        <div class="form-group" style="max-width:360px; margin-bottom:16px">
          <label class="form-label">Select Job to View Applicants</label>
          <select id="job-select" class="form-control" onchange="loadApplicants()">
            <option value="">— choose a job —</option>
          </select>
        </div>
        <div id="applicants-list"></div>
      </div>
    </div>
  </main>

  <!-- Edit Job Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Job Posting</h3>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="edit-alert"></div>
        <input type="hidden" id="edit-job-id">
        <div class="form-group">
          <label class="form-label">Job Title *</label>
          <input type="text" id="edit-title" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea id="edit-description" class="form-control" rows="5"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="edit-category" class="form-control">
              <option value="">Select…</option>
              <option>Technology</option><option>Marketing</option><option>Finance</option>
              <option>Design</option><option>Engineering</option><option>Healthcare</option>
              <option>Education</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Job Type</label>
            <select id="edit-job_type" class="form-control">
              <option value="full-time">Full Time</option>
              <option value="part-time">Part Time</option>
              <option value="contract">Contract</option>
              <option value="internship">Internship</option>
              <option value="remote">Remote</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="edit-location" class="form-control">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Min Salary ($)</label>
            <input type="number" id="edit-salary_min" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Max Salary ($)</label>
            <input type="number" id="edit-salary_max" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Skills (comma-separated)</label>
          <input type="text" id="edit-skills" class="form-control" placeholder="e.g. React, Node.js, AWS">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="edit-status" class="form-control">
            <option value="open">Open</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" id="save-edit-btn" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="../../Frontend/js/app.js"></script>
  <script>
    let allJobs = [];

    async function init() {
      const user = await Auth.requireRole('employer', 'login.html');
      if (!user) return;
      document.getElementById('greeting').textContent = `Welcome, ${user.name.split(' ')[0]} 👋`;
      await loadJobs();
    }

    async function loadJobs() {
      const list = document.getElementById('jobs-list');
      try {
        const data = await api.get('jobs.php?action=my');
        allJobs = data.jobs;

        const total     = allJobs.length;
        const open      = allJobs.filter(j => j.status === 'open').length;
        const closed    = allJobs.filter(j => j.status === 'closed').length;
        const applicants = allJobs.reduce((sum, j) => sum + Number(j.applicant_count), 0);

        document.getElementById('stat-total').textContent     = total;
        document.getElementById('stat-open').textContent      = open;
        document.getElementById('stat-closed').textContent    = closed;
        document.getElementById('stat-applicants').textContent = applicants;

        // Populate job select
        const sel = document.getElementById('job-select');
        sel.innerHTML = '<option value="">— choose a job —</option>' +
          allJobs.map(j => `<option value="${j.id}">${j.title} (${j.applicant_count} applicants)</option>`).join('');

        if (!allJobs.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>No jobs posted yet</h3><p>Create your first job listing to start receiving applications</p><a href="post-job.html" class="btn btn-primary mt-16">Post a Job</a></div>`;
          return;
        }

        list.innerHTML = `
          <div class="table-wrap card" style="padding:0">
            <table>
              <thead>
                <tr><th>Job Title</th><th>Type</th><th>Location</th><th>Salary</th><th>Applicants</th><th>Status</th><th>Posted</th><th>Actions</th></tr>
              </thead>
              <tbody>
                ${allJobs.map(j => `
                  <tr>
                    <td><strong>${j.title}</strong>${j.category ? `<div class="text-muted" style="font-size:12px">${j.category}</div>` : ''}</td>
                    <td><span class="badge badge-gray">${j.job_type}</span></td>
                    <td>${j.location || '—'}</td>
                    <td>${formatSalary(j.salary_min, j.salary_max)}</td>
                    <td><span class="badge badge-accent">${j.applicant_count}</span></td>
                    <td>${statusBadge(j.status)}</td>
                    <td class="text-muted">${formatDate(j.created_at)}</td>
                    <td>
                      <div style="display:flex;gap:6px">
                        <button class="btn btn-sm btn-outline" onclick="openEdit(${j.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteJob(${j.id}, this)">Delete</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function loadApplicants() {
      const jobId = document.getElementById('job-select').value;
      const list  = document.getElementById('applicants-list');
      if (!jobId) { list.innerHTML = ''; return; }

      list.innerHTML = '<div class="loader"></div>';
      try {
        const data = await api.get(`applications.php?action=job&job_id=${jobId}`);
        const apps = data.applications;

        if (!apps.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">👥</div><h3>No applicants yet</h3><p>Share this job to attract candidates</p></div>`;
          return;
        }

        list.innerHTML = `
          <div class="jobs-grid">
            ${apps.map(a => `
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
                  <div>
                    <div style="font-weight:700;font-size:16px">${a.name}</div>
                    <div class="text-sec" style="font-size:13px">${a.email}${a.phone ? ' · ' + a.phone : ''}</div>
                    ${a.location ? `<div class="text-muted" style="font-size:13px">📍 ${a.location}</div>` : ''}
                    <div style="margin-top:8px;font-size:13px;color:var(--text-muted)">Applied ${formatDate(a.applied_at)}</div>
                  </div>
                  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
                    ${statusBadge(a.status)}
                    ${a.resume_path ? `<a href="../${a.resume_path}" target="_blank" class="btn btn-outline btn-sm">📄 Resume</a>` : '<span class="text-muted" style="font-size:12px">No resume</span>'}
                  </div>
                </div>
                ${a.cover_letter ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-sec)">${a.cover_letter}</div>` : ''}
                <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
                  <button class="btn btn-sm" style="background:rgba(0,200,150,0.15);color:var(--green);border:1px solid rgba(0,200,150,0.3)"
                    onclick="updateStatus(${a.id}, 'accepted', this)">✓ Accept</button>
                  <button class="btn btn-sm btn-danger"
                    onclick="updateStatus(${a.id}, 'rejected', this)">✕ Reject</button>
                  <button class="btn btn-sm btn-outline"
                    onclick="updateStatus(${a.id}, 'pending', this)">⟳ Mark Pending</button>
                </div>
              </div>
            `).join('')}
          </div>`;
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function updateStatus(appId, status, btn) {
      setLoading(btn, true, '…');
      try {
        await api.put(`applications.php?action=status&id=${appId}`, { status });
        loadApplicants();
      } catch (err) {
        alert(err.message);
        setLoading(btn, false);
      }
    }

    function openEdit(jobId) {
      const job = allJobs.find(j => j.id == jobId);
      if (!job) return;
      document.getElementById('edit-job-id').value        = job.id;
      document.getElementById('edit-title').value         = job.title;
      document.getElementById('edit-description').value   = job.description;
      document.getElementById('edit-category').value      = job.category || '';
      document.getElementById('edit-job_type').value      = job.job_type;
      document.getElementById('edit-location').value      = job.location || '';
      document.getElementById('edit-salary_min').value    = job.salary_min || '';
      document.getElementById('edit-salary_max').value    = job.salary_max || '';
      document.getElementById('edit-skills').value        = job.skills || '';
      document.getElementById('edit-status').value        = job.status;
      document.getElementById('edit-modal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('open');
    }

    async function saveEdit() {
      const jobId = document.getElementById('edit-job-id').value;
      const btn   = document.getElementById('save-edit-btn');
      setLoading(btn, true, 'Saving…');
      try {
        await api.put(`jobs.php?action=update&id=${jobId}`, {
          title:       document.getElementById('edit-title').value,
          description: document.getElementById('edit-description').value,
          category:    document.getElementById('edit-category').value,
          job_type:    document.getElementById('edit-job_type').value,
          location:    document.getElementById('edit-location').value,
          salary_min:  document.getElementById('edit-salary_min').value,
          salary_max:  document.getElementById('edit-salary_max').value,
          skills:      document.getElementById('edit-skills').value,
          status:      document.getElementById('edit-status').value,
        });
        closeEditModal();
        await loadJobs();
      } catch (err) {
        showAlert('#edit-alert', err.message, 'error');
        setLoading(btn, false);
      }
    }

    async function deleteJob(jobId, btn) {
      if (!confirm('Delete this job posting? This cannot be undone.')) return;
      setLoading(btn, true, '…');
      try {
        await api.delete(`jobs.php?action=delete&id=${jobId}`);
        await loadJobs();
      } catch (err) {
        alert(err.message);
        setLoading(btn, false);
      }
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['jobs','applicants'].forEach(t =>
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab)
      );
    }

    init();
  </script>
</body>
</html>
