<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Smart Job Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .profile-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    .profile-header {
      display: flex; align-items: center; gap: 20px; margin-bottom: 32px;
    }
  </style>
</head>
<body class="page-wrapper">
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">Job<span>Portal</span></a>
      <div class="nav-links" id="nav-links"></div>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <main>
    <div class="container" style="max-width:640px">
      <div class="page-header">
        <h1>My Profile</h1>
        <p class="text-sec">Keep your information up to date</p>
      </div>

      <div id="profile-content"><div class="loader"></div></div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script>
    let user = null;

    async function init() {
      user = await Auth.requireAuth('login.html');
      if (!user) return;
      try {
        const data = await api.get('auth.php?action=me');
        renderProfile(data.user);
      } catch (err) {
        document.getElementById('profile-content').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function renderProfile(u) {
      const initials = u.name.split(' ').map(p => p[0]).join('').toUpperCase();
      document.getElementById('profile-content').innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar">${initials}</div>
          <div>
            <div style="font-size:22px;font-weight:800">${u.name}</div>
            <div class="text-sec">${u.email}</div>
            <span class="badge ${u.role === 'employer' ? 'badge-accent' : 'badge-green'}" style="margin-top:6px">
              ${u.role === 'employer' ? '🏢 Employer' : '🔍 Job Seeker'}
            </span>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:20px">Edit Profile</h3>
          <div id="profile-alert"></div>
          <form id="profile-form">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" id="name" class="form-control" value="${u.name}" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" value="${u.email}" disabled style="opacity:0.5">
              <div class="form-hint">Email cannot be changed</div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="phone" class="form-control" value="${u.phone || ''}" placeholder="+1 234 567 8900">
              </div>
              <div class="form-group">
                <label class="form-label">Location</label>
                <input type="text" id="location" class="form-control" value="${u.location || ''}" placeholder="City, Country">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Bio / About Me</label>
              <textarea id="bio" class="form-control" rows="4" placeholder="Tell employers about yourself…">${u.bio || ''}</textarea>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end">
              <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
            </div>
          </form>
        </div>

        <div class="card" style="margin-top:20px">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:4px">Account Security</h3>
          <p class="text-sec" style="font-size:14px;margin-bottom:16px">Change your password or reset it via email</p>
          <a href="forgot-password.html" class="btn btn-outline btn-sm">🔐 Reset Password</a>
        </div>

        <div class="card" style="margin-top:20px;border-color:rgba(255,79,106,0.3)">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:4px;color:var(--red)">Sign Out</h3>
          <p class="text-sec" style="font-size:14px;margin-bottom:16px">You'll need to sign in again to access your account</p>
          <button class="btn btn-danger btn-sm" onclick="Auth.logout()">Log Out</button>
        </div>
      `;

      document.getElementById('profile-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('save-btn');
        setLoading(btn, true, 'Saving…');
        try {
          await api.put('auth.php?action=profile', {
            name:     document.getElementById('name').value,
            phone:    document.getElementById('phone').value,
            location: document.getElementById('location').value,
            bio:      document.getElementById('bio').value,
          });
          showAlert('#profile-alert', 'Profile updated successfully! ✅', 'success');
          setLoading(btn, false);
          Auth._user = null; // Clear cache
        } catch (err) {
          showAlert('#profile-alert', err.message, 'error');
          setLoading(btn, false);
        }
      });
    }

    init();
  </script>
</body>
</html>
