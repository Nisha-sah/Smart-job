<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Smart Job Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-wrap { width: 100%; max-width: 440px; padding: 24px; }
    .auth-logo { text-align:center; margin-bottom:32px; font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; font-weight:800; }
    .auth-logo span { color: var(--accent); }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:36px; }
    .auth-title { font-size:22px; font-weight:800; margin-bottom:4px; }
    .auth-subtitle { color:var(--text-sec); font-size:14px; margin-bottom:28px; }
    .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--text-muted); font-size:13px; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">Job<span>Portal</span></div>
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div id="alert-area"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between">
            Password
            <a href="forgot-password.html" style="font-weight:500">Forgot password?</a>
          </label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>

      <div class="divider">or</div>
      <p style="text-align:center; font-size:14px; color:var(--text-sec)">
        Don't have an account?
        <a href="register.html" style="font-weight:600">Create one</a>
      </p>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      setLoading(btn, true, 'Signing in…');
      try {
        const data = await api.post('auth.php?action=login', {
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        const user = data.user;
        window.location.href = user.role === 'employer' ? 'employer-dashboard.html' : 'seeker-dashboard.html';
      } catch (err) {
        showAlert('#alert-area', err.message, 'error');
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
