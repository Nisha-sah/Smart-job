<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard — Smart Job Portal</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="page-wrapper">
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">Job<span>Portal</span></a>
      <div class="nav-links" id="nav-links"></div>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-header flex-between">
        <div>
          <h1 id="greeting">Dashboard</h1>
          <p class="text-sec">Track your applications and saved jobs</p>
        </div>
        <a href="jobs.html" class="btn btn-primary">Browse Jobs</a>
      </div>

      <!-- Stats Row -->
      <div class="stats-grid mb-24" style="margin-bottom:24px">
        <div class="card stat-card">
          <div class="stat-value" id="stat-applied">—</div>
          <div class="stat-label">Jobs Applied</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-saved">—</div>
          <div class="stat-label">Saved Jobs</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-accepted" style="color:var(--green)">—</div>
          <div class="stat-label">Accepted</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value" id="stat-pending" style="color:var(--yellow)">—</div>
          <div class="stat-label">Pending</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('applications', this)">My Applications</div>
        <div class="tab" onclick="switchTab('saved', this)">Saved Jobs</div>
        <div class="tab" onclick="switchTab('resume', this)">Resume</div>
      </div>

      <!-- Applications Tab -->
      <div id="tab-applications">
        <div id="applications-list"><div class="loader"></div></div>
      </div>

      <!-- Saved Jobs Tab -->
      <div id="tab-saved" class="hidden">
        <div id="saved-list"><div class="loader"></div></div>
      </div>

      <!-- Resume Tab -->
      <div id="tab-resume" class="hidden">
        <div class="card" style="max-width:560px">
          <h3 style="font-size:18px;font-weight:700;margin-bottom:20px">📄 Resume Management</h3>
          <div id="resume-info" style="margin-bottom:20px"><div class="loader"></div></div>
          <div class="form-group">
            <label class="form-label">Upload / Replace Resume</label>
            <input type="file" id="resume-file" class="form-control" accept=".pdf,.doc,.docx">
            <div class="form-hint">Accepted formats: PDF, DOC, DOCX. Max size: 5 MB</div>
          </div>
          <div id="upload-alert"></div>
          <button class="btn btn-primary" onclick="uploadResume()">Upload Resume</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script>
    let currentTab = 'applications';

    async function init() {
      const user = await Auth.requireRole('seeker', 'login.html');
      if (!user) return;
      document.getElementById('greeting').textContent = `Welcome back, ${user.name.split(' ')[0]} 👋`;
      loadApplications();
      loadSaved();
      loadResume();
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['applications','saved','resume'].forEach(t =>
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab)
      );
      currentTab = tab;
    }

    async function loadApplications() {
      const list = document.getElementById('applications-list');
      try {
        const data = await api.get('applications.php?action=my');
        const apps = data.applications;

        document.getElementById('stat-applied').textContent  = apps.length;
        document.getElementById('stat-accepted').textContent = apps.filter(a => a.status === 'accepted').length;
        document.getElementById('stat-pending').textContent  = apps.filter(a => a.status === 'pending').length;

        if (!apps.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>No applications yet</h3><p>Start applying to jobs to track them here</p><a href="jobs.html" class="btn btn-primary mt-16">Find Jobs</a></div>`;
          return;
        }

        list.innerHTML = `
          <div class="table-wrap card" style="padding:0">
            <table>
              <thead>
                <tr>
                  <th>Job</th>
                  <th>Employer</th>
                  <th>Type</th>
                  <th>Salary</th>
                  <th>Status</th>
                  <th>Applied</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody>
                ${apps.map(a => `
                  <tr>
                    <td><strong>${a.title}</strong></td>
                    <td>${a.employer_name}</td>
                    <td><span class="badge badge-gray">${a.job_type}</span></td>
                    <td>${formatSalary(a.salary_min, a.salary_max)}</td>
                    <td>${statusBadge(a.status)}</td>
                    <td class="text-muted">${formatDate(a.applied_at)}</td>
                    <td class="text-muted">${formatDate(a.updated_at)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function loadSaved() {
      const list = document.getElementById('saved-list');
      try {
        const data = await api.get('jobs.php?action=saved');
        const jobs = data.jobs;
        document.getElementById('stat-saved').textContent = jobs.length;

        if (!jobs.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">🔖</div><h3>No saved jobs</h3><p>Save jobs while browsing to find them here</p></div>`;
          return;
        }

        list.innerHTML = `<div class="jobs-grid">${jobs.map(job => `
          <div class="card card-hover">
            <div class="job-card">
              <div class="job-card-logo">🏢</div>
              <div class="job-card-body">
                <div class="job-card-title">${job.title}</div>
                <div class="job-card-company">${job.employer_name}</div>
                <div class="job-card-meta">
                  <span>📍 ${job.location || 'Remote'}</span>
                  <span>💼 ${job.job_type}</span>
                  <span>💰 ${formatSalary(job.salary_min, job.salary_max)}</span>
                </div>
              </div>
              <div class="job-card-actions">
                <a href="job-detail.html?id=${job.id}" class="btn btn-primary btn-sm">View & Apply</a>
              </div>
            </div>
          </div>`).join('')}</div>`;
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function loadResume() {
      const info = document.getElementById('resume-info');
      try {
        const data = await api.get('resume.php?action=get');
        const r = data.resume;
        info.innerHTML = `
          <div class="card" style="background:var(--bg-surface); display:flex; align-items:center; gap:16px; padding:16px">
            <span style="font-size:32px">📄</span>
            <div>
              <div style="font-weight:600">${r.filename}</div>
              <div class="text-muted" style="font-size:13px">Last updated: ${formatDate(r.updated_at)}</div>
            </div>
            <span class="badge badge-green" style="margin-left:auto">Uploaded</span>
          </div>`;
      } catch {
        info.innerHTML = `<div class="alert alert-info">No resume uploaded yet. Upload one below so employers can view it with your applications.</div>`;
      }
    }

    async function uploadResume() {
      const fileInput = document.getElementById('resume-file');
      if (!fileInput.files[0]) { showAlert('#upload-alert', 'Please select a file.', 'error'); return; }

      const formData = new FormData();
      formData.append('resume', fileInput.files[0]);

      try {
        const res = await fetch(`../backend/api/resume.php?action=upload`, {
          method: 'POST',
          credentials: 'include',
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert('#upload-alert', 'Resume uploaded successfully! ✅', 'success');
        loadResume();
      } catch (err) {
        showAlert('#upload-alert', err.message, 'error');
      }
    }

    init();
  </script>
</body>
</html>
