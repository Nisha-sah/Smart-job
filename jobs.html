<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs — Smart Job Portal</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="page-wrapper">
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">Job<span>Portal</span></a>
      <div class="nav-links" id="nav-links"></div>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Browse Jobs</h1>
        <p class="text-sec">Find the perfect opportunity from our latest listings</p>
      </div>

      <!-- Search bar inline -->
      <div style="display:flex; gap:12px; margin-bottom:32px">
        <input type="text" id="search-keyword" class="form-control" placeholder="Search keyword, title, skill…" style="flex:1">
        <input type="text" id="search-location" class="form-control" placeholder="Location" style="width:200px">
        <button class="btn btn-primary" onclick="loadJobs()">Search</button>
      </div>

      <div class="page-with-sidebar">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
          <div class="card">
            <div class="filter-section">
              <div class="filter-title">Job Type</div>
              <label class="filter-option"><input type="checkbox" value="full-time" class="type-filter"> Full Time</label>
              <label class="filter-option"><input type="checkbox" value="part-time" class="type-filter"> Part Time</label>
              <label class="filter-option"><input type="checkbox" value="contract" class="type-filter"> Contract</label>
              <label class="filter-option"><input type="checkbox" value="internship" class="type-filter"> Internship</label>
              <label class="filter-option"><input type="checkbox" value="remote" class="type-filter"> Remote</label>
            </div>
            <div class="filter-section">
              <div class="filter-title">Salary Range</div>
              <div class="form-group">
                <label class="form-label">Min ($)</label>
                <input type="number" id="sal-min" class="form-control" placeholder="0">
              </div>
              <div class="form-group">
                <label class="form-label">Max ($)</label>
                <input type="number" id="sal-max" class="form-control" placeholder="Any">
              </div>
            </div>
            <div class="filter-section">
              <div class="filter-title">Category</div>
              <select id="category-filter" class="form-control">
                <option value="">All Categories</option>
                <option>Technology</option>
                <option>Marketing</option>
                <option>Finance</option>
                <option>Design</option>
                <option>Engineering</option>
                <option>Healthcare</option>
                <option>Education</option>
                <option>Other</option>
              </select>
            </div>
            <button class="btn btn-primary btn-full" onclick="loadJobs()">Apply Filters</button>
            <button class="btn btn-outline btn-full" style="margin-top:8px" onclick="clearFilters()">Clear All</button>
          </div>
        </aside>

        <!-- Jobs List -->
        <div>
          <div class="flex-between mb-24">
            <span id="results-count" class="text-sec" style="font-size:14px"></span>
          </div>
          <div id="jobs-list" class="jobs-grid">
            <div class="loader"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script>
    let currentUser = null;

    async function init() {
      currentUser = await Auth.getUser();
      // Read URL params
      const p = new URLSearchParams(window.location.search);
      if (p.get('keyword')) document.getElementById('search-keyword').value = p.get('keyword');
      if (p.get('location')) document.getElementById('search-location').value = p.get('location');
      loadJobs();
    }

    async function loadJobs() {
      const list = document.getElementById('jobs-list');
      list.innerHTML = '<div class="loader"></div>';

      const keyword  = document.getElementById('search-keyword').value;
      const location = document.getElementById('search-location').value;
      const category = document.getElementById('category-filter').value;
      const salMin   = document.getElementById('sal-min').value;
      const salMax   = document.getElementById('sal-max').value;
      const types    = [...document.querySelectorAll('.type-filter:checked')].map(c => c.value);

      const params = new URLSearchParams({ action: 'list', keyword, location, category });
      if (salMin) params.set('salary_min', salMin);
      if (salMax) params.set('salary_max', salMax);
      if (types.length === 1) params.set('type', types[0]);

      try {
        const data = await api.get(`jobs.php?${params}`);
        const jobs = data.jobs;
        const filtered = types.length > 1 ? jobs.filter(j => types.includes(j.job_type)) : jobs;

        document.getElementById('results-count').textContent = `${filtered.length} job${filtered.length !== 1 ? 's' : ''} found`;

        if (!filtered.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>No jobs found</h3><p>Try different keywords or filters</p></div>`;
          return;
        }

        list.innerHTML = filtered.map(job => `
          <div class="card card-hover">
            <div class="job-card">
              <div class="job-card-logo">🏢</div>
              <div class="job-card-body">
                <div class="job-card-title">${job.title}</div>
                <div class="job-card-company">${job.employer_name}</div>
                <div class="job-card-meta">
                  <span>📍 ${job.location || 'Remote'}</span>
                  <span>💼 ${job.job_type}</span>
                  <span>💰 ${formatSalary(job.salary_min, job.salary_max)}</span>
                  ${job.category ? `<span>🏷 ${job.category}</span>` : ''}
                  <span>🕒 ${timeAgo(job.created_at)}</span>
                </div>
                ${job.skills ? `<div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px">
                  ${job.skills.split(',').map(s => `<span class="badge badge-gray">${s.trim()}</span>`).join('')}
                </div>` : ''}
              </div>
              <div class="job-card-actions">
                ${statusBadge(job.status)}
                <a href="job-detail.html?id=${job.id}" class="btn btn-primary btn-sm">View Job</a>
                ${currentUser?.role === 'seeker' ? `
                  <button class="btn btn-outline btn-sm" onclick="saveJob(${job.id}, this)">🔖 Save</button>
                ` : ''}
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function saveJob(jobId, btn) {
      if (!currentUser) { window.location.href = 'login.html'; return; }
      try {
        const data = await api.post(`jobs.php?action=save&id=${jobId}`, {});
        btn.textContent = data.message.includes('removed') ? '🔖 Save' : '✅ Saved';
      } catch (err) {
        alert(err.message);
      }
    }

    function clearFilters() {
      document.getElementById('search-keyword').value = '';
      document.getElementById('search-location').value = '';
      document.getElementById('category-filter').value = '';
      document.getElementById('sal-min').value = '';
      document.getElementById('sal-max').value = '';
      document.querySelectorAll('.type-filter').forEach(c => c.checked = false);
      loadJobs();
    }

    document.getElementById('search-keyword').addEventListener('keydown', e => { if (e.key === 'Enter') loadJobs(); });
    init();
  </script>
</body>
</html>
