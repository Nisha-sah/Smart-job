<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Smart Job Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-wrap { width:100%; max-width:440px; padding:24px; }
    .auth-logo { text-align:center; margin-bottom:32px; font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; font-weight:800; }
    .auth-logo span { color:var(--accent); }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:36px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">Job<span>Portal</span></div>
    <div class="auth-card">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:4px">Forgot Password?</h1>
      <p style="color:var(--text-sec);font-size:14px;margin-bottom:28px">Enter your email and we'll send you a reset link</p>

      <div id="alert-area"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="send-btn">Send Reset Link</button>
      </form>

      <p style="text-align:center;font-size:14px;color:var(--text-sec);margin-top:20px">
        Remember your password? <a href="login.html" style="font-weight:600">Sign in</a>
      </p>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('send-btn');
      setLoading(btn, true, 'Sending…');
      try {
        const data = await api.post('security.php?action=forgot-password', {
          email: document.getElementById('email').value
        });
        showAlert('#alert-area', data.message, 'success');
        // Dev mode: show token for testing
        if (data.dev_token) {
          showAlert('#alert-area',
            `✅ ${data.message}<br><br><strong>Dev mode:</strong> <a href="reset-password.html?token=${data.dev_token}">Click here to reset</a>`,
            'success');
        }
        setLoading(btn, false);
      } catch (err) {
        showAlert('#alert-area', err.message, 'error');
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
