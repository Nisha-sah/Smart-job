<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Smart Job Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-wrap { width:100%; max-width:440px; padding:24px; }
    .auth-logo { text-align:center; margin-bottom:32px; font-family:'Plus Jakarta Sans',sans-serif; font-size:26px; font-weight:800; }
    .auth-logo span { color:var(--accent); }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:36px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">Job<span>Portal</span></div>
    <div class="auth-card">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:4px">Reset Password</h1>
      <p style="color:var(--text-sec);font-size:14px;margin-bottom:28px">Enter your new password below</p>

      <div id="alert-area"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="confirm" class="form-control" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="reset-btn">Reset Password</button>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      showAlert('#alert-area', 'Invalid reset link. Please request a new one.', 'error');
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      if (password !== confirm) { showAlert('#alert-area', 'Passwords do not match.', 'error'); return; }

      const btn = document.getElementById('reset-btn');
      setLoading(btn, true, 'Resetting…');
      try {
        const data = await api.post('security.php?action=reset-password', { token, password });
        showAlert('#alert-area', data.message + ' Redirecting to login…', 'success');
        setTimeout(() => window.location.href = 'login.html', 2000);
      } catch (err) {
        showAlert('#alert-area', err.message, 'error');
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
